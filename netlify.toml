[build]
  # gen-seo.mjs erzeugt die statischen SEO-Landing-Pages (bosse/waffen/true-ending)
  # + sitemap.xml frisch aus index.html, damit sie bei jedem Deploy synchron bleiben.
  command   = "npm install && node scripts/gen-seo.mjs"
  publish   = "."

[functions]
  directory    = "netlify/functions"
  node_bundler = "esbuild"

# DATENBANK vom Deploy ENTKOPPELT (Quota-unabhaengige Deploys) -- Root Cause + Fix:
# Netlify stellt eine DB bereit / legt fuer Deploy-Previews einen DB-Branch an, SOBALD es
# das Paket "@netlify/database" im Projekt erkennt -- DAS ist der eigentliche Ausloeser
# (kein netlify.toml-Schalter; ein solcher existiert laut Doku nicht). Dieser "Netlify
# Database setup"-Schritt braucht DB-Compute. War die monatliche Neon-"active time quota"
# erschoepft, scheiterte er (Deploy-Preview: createSiteDatabaseBranch -> HTTP 500;
# Produktion: Migrations-Ping) und der GESAMTE Build/Deploy brach ab -- auch reine
# Frontend-Aenderungen (genau das war am 2026-06-15/16 der Fall).
# FIX: "@netlify/database" ist aus package.json ENTFERNT (niemand importiert es; es war nur
# der Trigger). @neondatabase/serverless ist jetzt direkte Dependency, damit der Runtime-
# Treiber (drizzle-orm/netlify-db) weiter aufloest. -> Build fasst die DB nicht mehr an.
# Zusaetzlich liegen die Migrationen jetzt unter "db/migrations/" statt im von Netlify
# ueberwachten "netlify/database/migrations/" (s. drizzle.config.ts) -> kein Auto-Apply.
# Das Schema ist stabil (1 Tabelle user_progress, 1 Migration seit Mai, laengst angewendet);
# nichts geht verloren, die Migration bleibt als Historie in db/migrations/.
# Die Runtime-DB (visits.mts Besucherzaehler, progress.mts Sync) verbindet sich zur LAUFZEIT
# direkt per Connection-String aus einer Env-Var (NETLIFY_DB_URL / NETLIFY_DATABASE_URL /
# DATABASE_URL; s. db/index.ts). DAMIT diese Features funktionieren, muss eine dieser
# Env-Vars in der Netlify-UI auf den bestehenden Neon-Connection-String gesetzt sein --
# sonst degradiert der Zaehler sauber (Fallback), Sync ist inaktiv.
# Kuenftige Schema-Aenderung? Mit "npm run db:generate" erzeugen (landet in db/migrations/)
# und EINMALIG manuell anwenden (drizzle-kit gegen den Connection-String bzw. Neon-Konsole).

[[headers]]
for = "/*"
  [headers.values]
  X-Frame-Options             = "SAMEORIGIN"
  X-Content-Type-Options      = "nosniff"
  Referrer-Policy             = "strict-origin-when-cross-origin"
  Content-Security-Policy     = "frame-ancestors 'self'; base-uri 'self'; object-src 'none'"
  Cache-Control               = "public, max-age=3600"

# index.html immer revalidieren (ETag macht das billig) — sonst sehen
# Besucher nach einem Deploy bis zu 1h alte Inhalte
[[headers]]
for = "/"
  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/index.html"
  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

# Assets sind NICHT versioniert/fingerprinted — daher kein 'immutable',
# 1 Tag Cache + Revalidierung reicht
[[headers]]
for = "/cd_assets/*"
  [headers.values]
  Cache-Control = "public, max-age=86400"

[[headers]]
for = "/site.webmanifest"
  [headers.values]
  Content-Type  = "application/manifest+json"
  Cache-Control = "public, max-age=86400"
