# ============================================================================
# Netlify ist NICHT mehr das Hosting dieses Wikis (Umzug 29.09.2026).
# https://crimson-desert-wiki.com wird komplett vom eigenen Raspberry Pi
# ausgeliefert (nginx + Cloudflare Tunnel, Deploy siehe .claude/CLAUDE.md).
#
# Diese Datei existiert nur noch für die ALTE Adresse
# https://crimson-desert-wiki.netlify.app (Netlify-Site "crimson-desert-wiki"):
#
#   1. 301-Umleitung auf die neue Domain, Pfad bleibt erhalten. Sie muss laufen,
#      solange Google die Adressänderung der Search Console abarbeitet: Migration
#      eingereicht am 17.09.2026, Fenster 180 Tage, also bis etwa 16.03.2027.
#   2. Zwei Ausnahmen, die direkt (Status 200) erreichbar bleiben:
#      - googleae4c65c5953c849f.html: Search-Console-Verifikation der alten
#        Property (ohne sie wäre die Adressänderung hinfällig).
#      - migrate-storage.html: Speicher-Übernahme. localStorage ist origin-gebunden;
#        Besucher holen ihren Fortschritt von der alten Adresse per Klick auf der
#        neuen Seite ab (Handoff über #cdmig=..., siehe index.html). Die Hinweisleiste
#        dort läuft bis 31.03.2027.
#
# Ausgeliefert wird nur der Ordner legacy-netlify/ (Kopien der beiden Dateien; die
# Originale im Repo-Root gehören zur Pi-Auslieferung und bleiben). Es gibt keinen
# Build, keine Functions, keine Datenbank. Der Build-Schritt ist ein echo, damit
# Netlify nichts mehr installiert oder generiert.
#
# Bewusst KEINE Regel für andere Hosts (z. B. crimson-desert-wiki.com): Zeigt der
# DNS-Eintrag irgendwo noch auf Netlify, würde eine Umleitung auf die Domain eine
# Schleife erzeugen. Solche Anfragen laufen ins Leere (404) statt im Kreis.
#
# ENDE: Nach dem 31.03.2027 (Migrationsfenster vorbei, Übernahmeleiste entfernt)
# die Netlify-Site "crimson-desert-wiki" löschen und dann netlify.toml sowie
# legacy-netlify/ aus dem Repo entfernen. Die anderen Sites des Netlify-Teams
# (z. B. Fußwerk) sind davon unabhängig.
# ============================================================================

[build]
  command = "echo 'Nur Weiterleitung der alten Adresse, kein Build'"
  publish = "legacy-netlify"
  # Nur bauen, wenn sich die Umleitung selbst ändert. Exit 0 (keine Änderung) = Build überspringen.
  ignore  = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- legacy-netlify netlify.toml"

# Domain-Level-Regeln brauchen force = true, sonst gewinnt eine lokal vorhandene Datei.
# Reihenfolge zählt: erst die beiden Ausnahmen, dann der Catch-all.
[[redirects]]
  from   = "https://crimson-desert-wiki.netlify.app/googleae4c65c5953c849f.html"
  to     = "/googleae4c65c5953c849f.html"
  status = 200
  force  = true

[[redirects]]
  from   = "https://crimson-desert-wiki.netlify.app/migrate-storage.html"
  to     = "/migrate-storage.html"
  status = 200
  force  = true

[[redirects]]
  from   = "https://crimson-desert-wiki.netlify.app/*"
  to     = "https://crimson-desert-wiki.com/:splat"
  status = 301
  force  = true

[[headers]]
  for = "/migrate-storage.html"
  [headers.values]
    X-Robots-Tag  = "noindex, nofollow"
    Cache-Control = "public, max-age=0, must-revalidate"
