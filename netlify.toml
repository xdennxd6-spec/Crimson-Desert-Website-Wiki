[build]
  # gen-seo.mjs erzeugt die statischen SEO-Landing-Pages (bosse/waffen/true-ending)
  # + sitemap.xml frisch aus index.html, damit sie bei jedem Deploy synchron bleiben.
  command   = "npm install && node scripts/gen-seo.mjs"
  publish   = "."

[functions]
  directory    = "netlify/functions"
  node_bundler = "esbuild"

# DB-Migrationen NICHT mehr bei jedem Deploy ausfuehren (entkoppelt 2026-06-15):
# Der Migrations-Schritt verbindet sich bei JEDEM Build mit der Netlify-DB (Neon). Ist
# deren monatliche "active time quota" (Compute-Wachzeit) aufgebraucht, scheitert dieser
# Ping und der GESAMTE Build/Deploy bricht ab -- auch reine Frontend-Aenderungen. Da das
# Schema stabil ist (1 Tabelle user_progress, 1 Migration seit Mai, laengst angewendet),
# koppeln wir die Migration vom Build ab -> Deploys sind quota-unabhaengig. Die Runtime-DB
# (Besucherzaehler visits.mts, Progress-Sync progress.mts) bleibt unveraendert -- die
# Functions verbinden sich zur Laufzeit ueber ihre eigene Connection (NETLIFY_DATABASE_URL),
# unabhaengig vom Build. Daten werden NICHT angefasst.
# Kuenftige Schema-Aenderung? Migration EINMALIG manuell anwenden (drizzle-kit gegen
# NETLIFY_DATABASE_URL bzw. Neon-Konsole), dann ggf. den Block hier temporaer reaktivieren.
# [database]
#   [database.migrations]
#     path = "netlify/database/migrations"

[[headers]]
for = "/*"
  [headers.values]
  X-Frame-Options             = "SAMEORIGIN"
  X-Content-Type-Options      = "nosniff"
  Referrer-Policy             = "strict-origin-when-cross-origin"
  Content-Security-Policy     = "frame-ancestors 'self'; base-uri 'self'; object-src 'none'"
  Cache-Control               = "public, max-age=3600"

# index.html immer revalidieren (ETag macht das billig) — sonst sehen
# Besucher nach einem Deploy bis zu 1h alte Inhalte
[[headers]]
for = "/"
  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/index.html"
  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

# Assets sind NICHT versioniert/fingerprinted — daher kein 'immutable',
# 1 Tag Cache + Revalidierung reicht
[[headers]]
for = "/cd_assets/*"
  [headers.values]
  Cache-Control = "public, max-age=86400"

[[headers]]
for = "/site.webmanifest"
  [headers.values]
  Content-Type  = "application/manifest+json"
  Cache-Control = "public, max-age=86400"
