<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800">
  <defs>
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-soft">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Ocean texture pattern -->
    <pattern id="ocean-lines" patternUnits="userSpaceOnUse" width="18" height="18" patternTransform="rotate(30)">
      <line x1="0" y1="0" x2="0" y2="18" stroke="#0c1520" stroke-width="0.7" opacity="0.5"/>
    </pattern>
    <!-- Pailune snow pattern -->
    <pattern id="snow-dots" patternUnits="userSpaceOnUse" width="20" height="20">
      <circle cx="5" cy="5" r="1" fill="#a0c4e0" opacity="0.15"/>
      <circle cx="15" cy="15" r="0.8" fill="#a0c4e0" opacity="0.1"/>
    </pattern>
    <!-- Desert grain -->
    <pattern id="desert-grain" patternUnits="userSpaceOnUse" width="16" height="16" patternTransform="rotate(15)">
      <ellipse cx="4" cy="4" rx="3" ry="1" fill="#4a1a08" opacity="0.12"/>
    </pattern>
    <radialGradient id="grad-hernand" cx="50%" cy="50%"><stop offset="0%" stop-color="#1e1a0a" stop-opacity="1"/><stop offset="100%" stop-color="#141008" stop-opacity="1"/></radialGradient>
    <radialGradient id="grad-pailune" cx="50%" cy="60%"><stop offset="0%" stop-color="#0c1624" stop-opacity="1"/><stop offset="100%" stop-color="#080e18" stop-opacity="1"/></radialGradient>
    <radialGradient id="grad-demeniss" cx="40%" cy="50%"><stop offset="0%" stop-color="#14100e" stop-opacity="1"/><stop offset="100%" stop-color="#0e0c0a" stop-opacity="1"/></radialGradient>
    <radialGradient id="grad-delesyia" cx="50%" cy="40%"><stop offset="0%" stop-color="#12101e" stop-opacity="1"/><stop offset="100%" stop-color="#0c0a14" stop-opacity="1"/></radialGradient>
    <radialGradient id="grad-crimson" cx="50%" cy="40%"><stop offset="0%" stop-color="#1c0c08" stop-opacity="1"/><stop offset="100%" stop-color="#140808" stop-opacity="1"/></radialGradient>
  </defs>

  <!-- Ocean background -->
  <rect width="1000" height="800" fill="#060a10"/>
  <rect width="1000" height="800" fill="url(#ocean-lines)"/>

  <!-- ═══ CONTINENT OUTLINE (main landmass) ═══ -->
  <path d="M 180,60 Q 350,30 600,40 Q 800,50 920,90 Q 970,160 960,300 Q 970,440 930,530 Q 900,600 820,660 Q 750,720 640,760 Q 520,790 400,780 Q 280,770 180,730 Q 100,690 60,620 Q 20,540 30,420 Q 20,300 50,200 Q 90,100 180,60 Z" fill="#12100a" stroke="#1e1a12" stroke-width="1.5"/>

  <!-- ═══ PAILUNE (North – Ice/Snow) ═══ -->
  <path d="M 230,65 Q 420,38 600,42 Q 720,46 820,80 Q 870,120 850,180 Q 830,240 790,270 Q 750,295 700,300 Q 640,310 580,305 Q 510,300 460,310 Q 410,315 370,300 Q 320,280 290,250 Q 255,215 240,175 Q 225,130 230,65 Z" fill="url(#grad-pailune)"/>
  <path d="M 230,65 Q 420,38 600,42 Q 720,46 820,80 Q 870,120 850,180 Q 830,240 790,270 Q 750,295 700,300 Q 640,310 580,305 Q 510,300 460,310 Q 410,315 370,300 Q 320,280 290,250 Q 255,215 240,175 Q 225,130 230,65 Z" fill="url(#snow-dots)"/>
  <path d="M 230,65 Q 420,38 600,42 Q 720,46 820,80 Q 870,120 850,180 Q 830,240 790,270 Q 750,295 700,300 Q 640,310 580,305 Q 510,300 460,310 Q 410,315 370,300 Q 320,280 290,250 Q 255,215 240,175 Q 225,130 230,65 Z" fill="none" stroke="#1c2e3e" stroke-width="1.2"/>

  <!-- ═══ DEMENISS (Northeast – Industrial/Dark) ═══ -->
  <path d="M 820,80 Q 900,85 940,120 Q 970,160 960,240 Q 960,320 940,390 Q 920,450 880,490 Q 840,520 800,520 Q 760,515 730,490 Q 705,465 700,430 Q 695,390 700,350 Q 700,300 700,270 Q 750,295 790,270 Q 830,240 850,180 Q 870,120 820,80 Z" fill="url(#grad-demeniss)"/>
  <path d="M 820,80 Q 900,85 940,120 Q 970,160 960,240 Q 960,320 940,390 Q 920,450 880,490 Q 840,520 800,520 Q 760,515 730,490 Q 705,465 700,430 Q 695,390 700,350 Q 700,300 700,270 Q 750,295 790,270 Q 830,240 850,180 Q 870,120 820,80 Z" fill="none" stroke="#1e1a16" stroke-width="1.2"/>

  <!-- ═══ HERNAND (Center – Starting Area) ═══ -->
  <path d="M 290,250 Q 320,280 370,300 Q 410,315 460,310 Q 510,300 580,305 Q 640,310 700,300 Q 700,350 695,390 Q 700,430 680,470 Q 660,505 630,530 Q 595,555 550,570 Q 505,582 460,578 Q 415,572 375,555 Q 335,535 305,505 Q 278,475 270,440 Q 262,408 270,375 Q 275,320 290,250 Z" fill="url(#grad-hernand)"/>
  <path d="M 290,250 Q 320,280 370,300 Q 410,315 460,310 Q 510,300 580,305 Q 640,310 700,300 Q 700,350 695,390 Q 700,430 680,470 Q 660,505 630,530 Q 595,555 550,570 Q 505,582 460,578 Q 415,572 375,555 Q 335,535 305,505 Q 278,475 270,440 Q 262,408 270,375 Q 275,320 290,250 Z" fill="none" stroke="#2a2415" stroke-width="1.3"/>

  <!-- ═══ DELESYIA (West/Southwest – Mystical) ═══ -->
  <path d="M 90,200 Q 150,140 230,65 Q 240,175 255,215 Q 290,250 270,375 Q 262,408 270,440 Q 278,475 305,505 Q 290,540 275,570 Q 255,610 230,640 Q 200,670 160,690 Q 120,705 80,690 Q 50,670 40,630 Q 28,590 35,540 Q 42,490 60,450 Q 75,405 78,360 Q 82,300 85,250 Q 87,220 90,200 Z" fill="url(#grad-delesyia)"/>
  <path d="M 90,200 Q 150,140 230,65 Q 240,175 255,215 Q 290,250 270,375 Q 262,408 270,440 Q 278,475 305,505 Q 290,540 275,570 Q 255,610 230,640 Q 200,670 160,690 Q 120,705 80,690 Q 50,670 40,630 Q 28,590 35,540 Q 42,490 60,450 Q 75,405 78,360 Q 82,300 85,250 Q 87,220 90,200 Z" fill="none" stroke="#1e1a2e" stroke-width="1.2"/>

  <!-- ═══ CRIMSON DESERT (South – Red/Barren) ═══ -->
  <path d="M 305,505 Q 335,535 375,555 Q 415,572 460,578 Q 505,582 550,570 Q 595,555 630,530 Q 660,505 680,470 Q 700,430 730,490 Q 760,515 800,520 Q 820,570 800,630 Q 780,690 730,730 Q 680,760 600,775 Q 520,785 440,780 Q 360,770 295,745 Q 250,720 230,690 Q 200,670 230,640 Q 255,610 275,570 Q 290,540 305,505 Z" fill="url(#grad-crimson)"/>
  <path d="M 305,505 Q 335,535 375,555 Q 415,572 460,578 Q 505,582 550,570 Q 595,555 630,530 Q 660,505 680,470 Q 700,430 730,490 Q 760,515 800,520 Q 820,570 800,630 Q 780,690 730,730 Q 680,760 600,775 Q 520,785 440,780 Q 360,770 295,745 Q 250,720 230,690 Q 200,670 230,640 Q 255,610 275,570 Q 290,540 305,505 Z" fill="url(#desert-grain)"/>
  <path d="M 305,505 Q 335,535 375,555 Q 415,572 460,578 Q 505,582 550,570 Q 595,555 630,530 Q 660,505 680,470 Q 700,430 730,490 Q 760,515 800,520 Q 820,570 800,630 Q 780,690 730,730 Q 680,760 600,775 Q 520,785 440,780 Q 360,770 295,745 Q 250,720 230,690 Q 200,670 230,640 Q 255,610 275,570 Q 290,540 305,505 Z" fill="none" stroke="#2a1410" stroke-width="1.3"/>

  <!-- ═══ REGION BORDER LINES (subtle) ═══ -->
  <!-- Hernand/Pailune border -->
  <path d="M 290,250 Q 370,300 460,310 Q 550,300 640,310 Q 700,300" fill="none" stroke="#c9a227" stroke-width="0.8" stroke-dasharray="5,4" opacity="0.3"/>
  <!-- Hernand/Demeniss border -->
  <path d="M 700,300 Q 700,350 700,430" fill="none" stroke="#c9a227" stroke-width="0.8" stroke-dasharray="5,4" opacity="0.3"/>
  <!-- Hernand/Delesyia border -->
  <path d="M 270,375 Q 278,475 305,505" fill="none" stroke="#c9a227" stroke-width="0.8" stroke-dasharray="5,4" opacity="0.3"/>
  <!-- Hernand/Crimson Desert border -->
  <path d="M 305,505 Q 460,578 630,530 Q 680,470 700,430" fill="none" stroke="#c9a227" stroke-width="0.8" stroke-dasharray="5,4" opacity="0.3"/>

  <!-- ═══ DECORATIVE – Mountains Pailune ═══ -->
  <g opacity="0.55" fill="#c0d8e8" stroke="#c0d8e8" stroke-width="0.5">
    <polygon points="490,80 480,110 500,110" opacity="0.7"/>
    <polygon points="510,75 498,108 522,108" opacity="0.8"/>
    <polygon points="530,82 519,110 541,110" opacity="0.7"/>
    <polygon points="570,70 557,102 583,102" opacity="0.85"/>
    <polygon points="590,78 580,108 600,108" opacity="0.7"/>
    <polygon points="420,90 409,118 431,118" opacity="0.6"/>
    <polygon points="440,85 428,115 452,115" opacity="0.75"/>
    <polygon points="640,75 628,106 652,106" opacity="0.7"/>
    <polygon points="660,82 650,112 670,112" opacity="0.6"/>
    <polygon points="680,78 669,108 691,108" opacity="0.65"/>
    <polygon points="700,85 690,112 710,112" opacity="0.55"/>
    <polygon points="350,95 339,124 361,124" opacity="0.55"/>
    <polygon points="370,88 360,118 380,118" opacity="0.6"/>
    <!-- Snow caps -->
    <polygon points="510,75 505,85 515,85" fill="white" opacity="0.6" stroke="none"/>
    <polygon points="570,70 565,82 575,82" fill="white" opacity="0.6" stroke="none"/>
    <polygon points="640,75 635,86 645,86" fill="white" opacity="0.5" stroke="none"/>
  </g>

  <!-- ═══ DECORATIVE – Mountains Delesyia ═══ -->
  <g opacity="0.4" fill="#8a7aaa" stroke="#8a7aaa" stroke-width="0.4">
    <polygon points="100,320 91,342 109,342"/>
    <polygon points="118,312 108,335 128,335"/>
    <polygon points="95,280 86,302 104,302"/>
    <polygon points="75,350 66,372 84,372"/>
    <polygon points="60,390 51,410 69,410"/>
  </g>

  <!-- ═══ DECORATIVE – Demeniss industrial markers ═══ -->
  <g opacity="0.35" fill="#505060">
    <rect x="820" y="200" width="6" height="18" rx="1"/>
    <rect x="832" y="185" width="6" height="33" rx="1"/>
    <rect x="844" y="195" width="6" height="23" rx="1"/>
    <rect x="856" y="210" width="6" height="16" rx="1"/>
    <!-- smoke -->
    <path d="M 823,200 Q 822,195 824,190 Q 826,185 824,180" fill="none" stroke="#606070" stroke-width="1.5" opacity="0.4"/>
    <path d="M 835,185 Q 834,179 836,173 Q 838,167 836,162" fill="none" stroke="#606070" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- ═══ DECORATIVE – Crimson Desert patterns ═══ -->
  <g opacity="0.2">
    <line x1="360" y1="620" x2="500" y2="640" stroke="#8a3a20" stroke-width="1"/>
    <line x1="380" y1="640" x2="480" y2="660" stroke="#8a3a20" stroke-width="1"/>
    <line x1="500" y1="630" x2="620" y2="650" stroke="#8a3a20" stroke-width="1"/>
    <line x1="520" y1="650" x2="640" y2="670" stroke="#8a3a20" stroke-width="1"/>
  </g>

  <!-- ═══ RIVERS ═══ -->
  <path d="M 460,310 Q 450,360 445,410 Q 440,460 450,510" fill="none" stroke="#1a4060" stroke-width="2.5" opacity="0.5"/>
  <path d="M 445,410 Q 400,430 360,450 Q 320,470 305,505" fill="none" stroke="#1a4060" stroke-width="2" opacity="0.4"/>
  <path d="M 570,305 Q 580,360 590,420 Q 600,480 600,530" fill="none" stroke="#1a4060" stroke-width="2" opacity="0.35"/>

  <!-- ═══ SMALL ISLANDS ═══ -->
  <ellipse cx="130" cy="760" rx="28" ry="16" fill="#13100a" stroke="#1e1a12" stroke-width="1" opacity="0.8"/>
  <ellipse cx="880" cy="720" rx="22" ry="12" fill="#13100a" stroke="#1e1a12" stroke-width="1" opacity="0.7"/>
  <ellipse cx="940" cy="600" rx="15" ry="9" fill="#12100a" stroke="#1e1a12" stroke-width="1" opacity="0.6"/>

  <!-- ═══ REGION LABELS ═══ -->
  <!-- Pailune -->
  <text x="490" y="155" text-anchor="middle" font-family="Georgia,serif" font-size="17" font-weight="bold" fill="#a0c4e0" opacity="0.7" letter-spacing="3" filter="url(#glow-soft)">PAILUNE</text>
  <text x="490" y="172" text-anchor="middle" font-family="Georgia,serif" font-size="8.5" fill="#6090b0" opacity="0.5" letter-spacing="4">SCHNEELANDE</text>

  <!-- Hernand -->
  <text x="475" y="420" text-anchor="middle" font-family="Georgia,serif" font-size="18" font-weight="bold" fill="#c9a227" opacity="0.55" letter-spacing="3" filter="url(#glow-soft)">HERNAND</text>
  <text x="475" y="437" text-anchor="middle" font-family="Georgia,serif" font-size="8.5" fill="#907020" opacity="0.45" letter-spacing="4">HAUPTREGION</text>

  <!-- Demeniss -->
  <text x="820" y="360" text-anchor="middle" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#9090a0" opacity="0.55" letter-spacing="2" filter="url(#glow-soft)">DEMENISS</text>
  <text x="820" y="375" text-anchor="middle" font-family="Georgia,serif" font-size="7.5" fill="#606070" opacity="0.45" letter-spacing="3">INDUSTRIEZONE</text>

  <!-- Delesyia -->
  <text x="160" y="430" text-anchor="middle" font-family="Georgia,serif" font-size="13" font-weight="bold" fill="#9080c0" opacity="0.55" letter-spacing="2" filter="url(#glow-soft)">DELESYIA</text>
  <text x="160" y="445" text-anchor="middle" font-family="Georgia,serif" font-size="7.5" fill="#6050a0" opacity="0.45" letter-spacing="3">MAGISCHES REICH</text>

  <!-- Crimson Desert -->
  <text x="490" y="660" text-anchor="middle" font-family="Georgia,serif" font-size="15" font-weight="bold" fill="#c04030" opacity="0.5" letter-spacing="2" filter="url(#glow-soft)">CRIMSON DESERT</text>
  <text x="490" y="676" text-anchor="middle" font-family="Georgia,serif" font-size="7.5" fill="#803020" opacity="0.4" letter-spacing="3">DIE ROTE WÜSTE</text>

  <!-- ═══ COMPASS ROSE ═══ -->
  <g transform="translate(920, 710)" opacity="0.4">
    <circle r="22" fill="none" stroke="#c9a227" stroke-width="0.8"/>
    <line x1="0" y1="-18" x2="0" y2="18" stroke="#c9a227" stroke-width="0.8"/>
    <line x1="-18" y1="0" x2="18" y2="0" stroke="#c9a227" stroke-width="0.8"/>
    <polygon points="0,-22 -4,-10 4,-10" fill="#c9a227"/>
    <text x="0" y="-26" text-anchor="middle" font-family="Georgia,serif" font-size="8" fill="#c9a227" font-weight="bold">N</text>
  </g>

  <!-- ═══ CORNER ORNAMENTS ═══ -->
  <g stroke="#c9a227" stroke-width="0.8" fill="none" opacity="0.25">
    <path d="M 8,8 L 28,8 M 8,8 L 8,28"/>
    <path d="M 992,8 L 972,8 M 992,8 L 992,28"/>
    <path d="M 8,792 L 28,792 M 8,792 L 8,772"/>
    <path d="M 992,792 L 972,792 M 992,792 L 992,772"/>
  </g>

  <!-- Map title -->
  <text x="500" y="24" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#c9a227" opacity="0.3" letter-spacing="6">PYWEL — DIE WELT VON CRIMSON DESERT</text>
</svg>
